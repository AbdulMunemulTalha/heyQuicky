# Runs Quicky and its MongoDB behind Caddy, which gets and renews the HTTPS
# certificate automatically. Point the domain's DNS A record at this server first.
services:
  quicky:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/quicky
    depends_on:
      mongo:
        condition: service_healthy

  # MongoDB is only reachable from the quicky container; no ports are published.
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN:-heyquicky.com} --to quicky:3000
    volumes:
      - caddy-data:/data
    depends_on:
      - quicky

volumes:
  mongo-data:
  caddy-data:
